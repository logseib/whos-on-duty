<!doctype html>
<html lang="en" style="background:#f3f3f3">
<head>

<style>
:root{--bg:#f3f3f3;--ink:#1d1d1b;--muted:#77756f;--accent:#1f4fbf;--line:#ddd9cf;--card:#fff;--boys:#0000ff;--girls:#f07c1e;--warn:#9a5b00;--warnbg:#fff4de}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;display:flex;flex-direction:column;justify-content:center}
main{box-sizing:border-box;width:100%;max-width:520px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
h1{font-size:1.35rem;margin:0;letter-spacing:-.01em;flex:none}
#cards{display:flex;flex-direction:column;gap:6px;min-height:171.3px}#nx{min-height:158.7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.card.boys{--c:var(--boys)}.card.girls{--c:var(--girls)}
.hd{display:flex;justify-content:space-between;align-items:center;flex:none}
.card h2{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--c);margin:0}
.call{color:var(--c);font-weight:650;font-size:.8rem;text-decoration:none;padding:2px 0}
.now{display:flex;flex-direction:column;gap:4px}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.av{border-radius:50%;object-fit:cover;background:#e7e3d8;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#5a574f;font-weight:600;overflow:hidden;width:44px;height:44px;font-size:.9rem;border:1px solid #d9d9d9;padding:0}
.card.two .av{width:34px;height:34px;font-size:.75rem}
.pname{font-size:1.4rem;font-weight:650;line-height:1.1;white-space:nowrap;flex:none}
.pill{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;background:#f1f9f2;color:#6fae80;font-size:12.5px;font-weight:500;line-height:1.2;border-radius:999px;padding:3px 9px}
.pill svg{width:11px;height:11px;flex:none;display:block}
@media (max-width:430px){.person{gap:8px}.pill{font-size:10.5px;padding:3px 6px;gap:2px}.pill svg{width:10px;height:10px}}
.pt{display:inline-flex;align-items:center;gap:inherit;flex:none}
.pill.mq .pt{animation:pillmq var(--mt,6s) ease-in-out infinite alternate}
@keyframes pillmq{0%,15%{transform:translateX(0)}85%,100%{transform:translateX(var(--mx,0))}}

.none{font-size:.9rem;font-weight:600;color:var(--muted)}
.nnote{font-size:.7rem;color:var(--muted);font-weight:400;line-height:1.1}
.nx{flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:.72rem}
.nx table{width:100%;border-collapse:collapse;table-layout:fixed}
.nx th{font-weight:650;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:1px 0 2px}
.nx th.b{color:var(--boys)}.nx th.g{color:var(--girls)}
.nx td{padding:1.5px 0;border-top:1px solid #efece4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.nx td:first-child{color:var(--muted);width:22%}
.nx td.m{color:var(--muted)}.nx td.ch{color:var(--warn)}
.btn{display:block;width:100%;border:0;border-radius:10px;background:#6e6e6e;color:#fff;font:600 .82rem/1 inherit;font-family:inherit;padding:11px;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:.9rem;padding:8px 0;cursor:pointer}
.link.red{color:#b3261e}
.ov-wrap{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov-wrap.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain;touch-action:pan-y}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e9e5da;padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;font:600 .92rem inherit;font-family:inherit;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 5px}
select,input[type=text],input[type=password],input[type=tel]{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.chk{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 12px;margin-bottom:6px;font-size:.95rem}
.chk input{width:20px;height:20px;accent-color:#2b55c9}
.codein{font-size:28px;letter-spacing:.5em;text-align:center;margin-top:6px}
.grp{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 0 4px}
.mut{color:var(--muted)}
.msg{margin-top:12px;font-size:.9rem;padding:10px 12px;border-radius:10px;display:none}
.msg.on{display:block}.msg.err{background:#fdecea;color:#8c1d18}.msg.ok{background:#e6f4ec;color:#14532d}.msg.info{background:#eef0f7;color:#3b4570}
.help{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.flex{display:flex;gap:10px;margin-top:16px}
.flex .btn{flex:1;font-size:1rem;padding:15px}
/* ---- add to home screen helper (same approach as the Card Tracker site) ---- */
#a2hs{position:fixed;left:12px;right:12px;bottom:16px;max-width:420px;margin:0 auto;background:#fff;border:1px solid var(--line);border-top:3px solid #6e6e6e;border-radius:6px;padding:16px 18px;box-shadow:0 6px 24px rgba(0,0,0,.18);font:14px/1.45 -apple-system,Helvetica,sans-serif;display:none;z-index:5}
#a2hs .a2hsHead{display:flex;align-items:center;gap:12px;padding-right:28px}
#a2hs .appicon{width:60px;height:60px;flex:none;border-radius:13.4px;overflow:hidden;display:block}
#help{position:fixed;right:16px;bottom:16px;width:40px;height:40px;border-radius:50%;margin:0;padding:0;background:rgba(214,214,214,.8);color:#555;border:0;box-shadow:none;display:flex;align-items:center;justify-content:center;z-index:4;cursor:pointer}
#help svg{display:block;width:22px;height:22px}
#help svg *{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#a2hs b{font-size:15px}
#a2hs p{margin:6px 0 12px;color:var(--muted)}
#a2hs ol{list-style:none;margin:-4px 0 0;padding:0;counter-reset:s}
#a2hs li{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--ink);counter-increment:s}
#a2hs li::before{content:counter(s);font-size:12px;color:var(--muted);width:10px}
#a2hs .ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#ececec;flex:none}
#a2hs .x{position:absolute;top:4px;right:8px;background:none;border:0;color:var(--ink);font-size:30px;line-height:1;width:auto;margin:0;padding:6px 8px;cursor:pointer}
/* ---- boot: staggered fade-in + header check animation (transform/opacity only) ---- */
.st{opacity:0;transform:translateY(4px);transition:opacity .5s ease var(--d,0s),transform .5s ease var(--d,0s)}
body.go .st{opacity:1;transform:none}
.av img{opacity:0;transition:opacity .4s ease}.av img.ld{opacity:1}
#hr{position:relative;display:block;padding-left:28px}
#hdate{display:inline-block}
#ck{position:absolute;left:0;top:50%;margin-top:-11px;width:22px;height:22px;transform:translateX(var(--tx,0px))}
#ck svg{display:block;width:22px;height:22px;overflow:visible}
#ck .bg{fill:#f3f3f3}
#ck .ring{fill:none;stroke:#9a9a9a;stroke-width:1;stroke-dasharray:63;stroke-dashoffset:63;stroke-linecap:round}
#ck .tick{fill:none;stroke:#9a9a9a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.go #ck{animation:ckslide .9s cubic-bezier(.45,0,.25,1) .3s both,ckfade .6s ease 7.75s both}
body.go #hdate{animation:dreveal .9s cubic-bezier(.45,0,.25,1) .3s both}
body.go #ck .ring{animation:ckring 1s ease-in-out 1.25s both,ckgreen .3s ease 2.3s both}
body.go #ck .tick{animation:ckgreen .3s ease 2.3s both}
body.go #ck svg{animation:ckpop .45s ease 2.3s both}
@keyframes ckslide{from{transform:translateX(var(--tx,0px))}to{transform:translateX(0)}}
@keyframes dreveal{from{clip-path:inset(-4px 0 -4px calc(var(--tx,0px) - 17px))}to{clip-path:inset(-4px 0 -4px -17px)}}
@keyframes ckring{from{stroke-dashoffset:63}to{stroke-dashoffset:0}}
@keyframes ckgreen{from{stroke:#9a9a9a}to{stroke:#2e9e4f}}
@keyframes ckfade{from{opacity:1}to{opacity:0}}
@keyframes ckpop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
</style>
</head>
<body>
<main>
  <h1 style="display:flex;justify-content:space-between;align-items:baseline">Who&#39;s on duty?<span id="hr" class="st"><span id="ck" aria-hidden="true"><svg viewBox="0 0 22 22"><circle class="bg" cx="11" cy="11" r="10"/><circle class="ring" cx="11" cy="11" r="10" transform="rotate(-90 11 11)"/><path class="tick" d="M6.6 11.4l3.1 3.1 5.7-6.4"/></svg></span><span id="hdate" style="color:#9a9a9a;font-weight:inherit"></span></span></h1><script>(function(){function u(){var d=new Date(),o={timeZone:"America/Phoenix"};document.getElementById("hdate").textContent=d.toLocaleDateString("en-US",Object.assign({weekday:"short"},o))+", "+d.toLocaleDateString("en-US",Object.assign({month:"short",day:"numeric"},o))}u();setInterval(u,60000)})();</script>
  <div id="cards"></div>
  <div class="nx st" style="--d:1.5s" id="nx"></div>
  <button class="btn st" style="--d:1.5s" id="open">I'm on duty / Issue a correction</button>
  <script>try{var h=(localStorage.getItem('wod_h')||'').split(',');if(h.length==2&&h[0]>0&&h[1]>0){document.getElementById('cards').style.minHeight=h[0]+'px';document.getElementById('nx').style.minHeight=h[1]+'px'}}catch(e){}</script>
</main>

<div class="ov-wrap" id="ov" role="dialog" aria-modal="true">
 <div class="sheet">
  <div id="formStep">
  <div class="seg"><button id="m1" class="on" type="button">I'm on duty</button><button id="m2" type="button">Issue a correction</button></div>

  <label class="f" for="me">Who are you?</label>
  <select id="me"></select>

  <div id="corrOnly" style="display:none">
    <label class="f" for="date">Day</label>
    <select id="date"></select>
    <div id="deanChecks"></div>
  </div>

  <div class="flex"><button class="btn sec" id="cancel" type="button">Cancel</button><button class="btn" id="save" type="button">Save</button></div>
  <div style="text-align:center"><button class="link red" id="reset" type="button" style="display:none">Clear change and go back to the schedule</button></div>
  </div>

  <div id="codeStep" style="display:none">
    <label class="f" for="code" style="font-size:1rem;color:var(--ink);margin-top:4px">Enter four digit code to save.</label>
    <input type="tel" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000" class="codein">
    <div class="flex"><button class="btn sec" id="codeBack" type="button">Back</button><button class="btn" id="codeOk" type="button">Save</button></div>
  </div>

  <div class="msg" id="msg"></div>
 </div>
</div>

<div id="a2hs" role="dialog" aria-label="Add to Home Screen">
  <button class="x" id="a2hsX" aria-label="Close">×</button>
  <div class="a2hsHead"><img class="appicon" src="icon-180.png" alt="Who's on duty? icon" width="60" height="60"><b>Keep this one tap away</b></div>
  <p id="a2hsText">Add it to your home screen in three taps:</p>
  <ol id="a2hsSteps"><li><span class="ic"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="#555555" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Tap the <b>menu</b> button in Safari's toolbar</span></li><li><span class="ic"><svg width="20" height="20" viewBox="0 0 15 18"><path d="M7.5 1v10M4 4.5L7.5 1 11 4.5" stroke="#555555" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 7.5H2.5v9h10v-9H10" stroke="#555555" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Tap <b>Share</b></span></li><li><span class="ic"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="15" height="15" rx="3.5" stroke="#555555" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 6.5v7M6.5 10h7" stroke="#555555" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Tap <b>Add to Home Screen</b></span></li></ol>
</div>
<button id="help" aria-label="Add to Home Screen"></button>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var S=null,CFG=null,LIVE=[],FILE=[],liveOK=null,lastLive=0;
var params=new URLSearchParams(location.search);
var FAKE_NOW=params.get('now'); // testing aid: ?now=2026-10-29T10:00-07:00
function nowMs(){return FAKE_NOW?Date.parse(FAKE_NOW):Date.now()}
var MS=86400000;
/* Load time shown in the pills: set once, never updated. */
var LOADED=(function(){try{return new Date().toLocaleTimeString('en-US',{timeZone:'America/Phoenix',hour:'numeric',minute:'2-digit'}).replace(/[\s\u202f]*([AP])M/i,function(m,x){return x.toLowerCase()+'m'})}catch(e){return''}})();
var PILL='<span class="pill"><span class="pt"><span class="lbl">Up to date</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6.3l2.6 2.6 5-5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'+(LOADED?'<span>('+LOADED+')</span>':'')+'</span></span>';
function dutyDate(ms){ms=ms==null?nowMs():ms;return new Date(ms-14*3600000).toISOString().slice(0,10)} // Phoenix = UTC-7, shift starts 7:00
function addDays(s,n){return new Date(Date.parse(s+'T00:00:00Z')+n*MS).toISOString().slice(0,10)}
function fmt(s,o){return new Date(s+'T00:00:00Z').toLocaleDateString('en-US',Object.assign({timeZone:'UTC'},o))}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- resolve who is on duty ---------- */
function inRange(r,d){return r.from<=d&&d<=r.to}
function resolve(dorm,d){
  var best=null;
  LIVE.concat(FILE).forEach(function(o){if(o.dorm===dorm&&o.date===d&&(!best||(o.at||'')>(best.at||'')))best=o});
  if(best&&best.clear!==true)return{deans:best.deans||[],src:'override',note:best.note||'',by:best.by,at:best.at,kind:best.kind};
  var ex=null;(S.exceptions||[]).forEach(function(e){if(e.dorm===dorm&&inRange(e,d))ex=e});
  if(ex)return{deans:ex.deans||[],src:'exception',note:ex.note||''};
  var row=null;(S.schedule[dorm]||[]).forEach(function(r){if(inRange(r,d))row=r});
  if(row)return{deans:row.deans||[],src:'schedule',note:row.note||''};
  return{deans:[],src:'gap',note:''};
}

/* ---------- rendering ---------- */
function initials(n){return n.split(/\s+/).map(function(x){return x[0]}).join('').slice(0,2)}
function avatar(id,cls){
  var d=S.deans[id];if(!d)return'';
  return '<span class="av '+cls+'" title="'+esc(d.name)+'"><img class="av '+cls+'" style="border:0;width:100%;height:100%" src="'+esc(d.photo)+'" alt="'+esc(d.name)+'" onerror="this.parentNode.textContent=\''+esc(initials(d.name))+'\'"></span>';
}
function avatarL(id){
  var d=S.deans[id];
  return '<span class="av"><img src="'+esc(d.photo)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.parentNode.textContent=\''+esc(initials(d.name))+'\'"></span>';
}
function names(r){return r.deans.map(function(i){return S.deans[i].first}).join(' & ')}
function render(){
  if(!S)return;
  var today=dutyDate(),html='';
  ['boys','girls'].forEach(function(dorm){
    var D=S.dorms[dorm],r=resolve(dorm,today);
    html+='<section class="card st '+dorm+(r.deans.length>1?' two':'')+'" style="--d:'+(dorm==='boys'?'.5s':'1s')+'"><div class="hd"><h2>'+esc(D.label)+'</h2><a class="call" href="tel:'+esc(D.phone.replace(/[^0-9+]/g,''))+'">Dean on duty '+esc(D.phone)+'</a></div><div class="now">';
    if(r.deans.length){
      html+=r.deans.map(function(id,k){return '<div class="person">'+avatarL(id)+'<div class="pname">'+esc(S.deans[id].name)+'</div>'+(k===0?PILL:'')+'</div>'}).join('');
      if(r.note)html+='<div class="nnote">'+esc(r.note)+'</div>';
    }else if(r.src==='gap'){
      html+='<div class="person"><div class="none">Not scheduled</div>'+PILL+'</div>';
    }else{
      html+='<div class="person"><div class="none">No duty<div class="nnote">'+esc(r.note)+'</div></div>'+PILL+'</div>';
    }
    html+='</div></section>';
  });
  $('cards').innerHTML=html;
  [].forEach.call(document.querySelectorAll('#cards img'),function(i){if(i.complete)i.classList.add('ld');else{i.onload=function(){i.classList.add('ld')}}});
  var t='<table><tr><th>Next 7 days</th><th class="b">Boys</th><th class="g">Girls</th></tr>';
  for(var i=1;i<=7;i++){
    var d=addDays(today,i);
    t+='<tr><td>'+esc(fmt(d,{weekday:'short',month:'numeric',day:'numeric'}))+'</td>'+['boys','girls'].map(function(dorm){
      var x=resolve(dorm,d);
      return '<td class="'+(x.deans.length?(x.src==='override'?'ch':''):'m')+'">'+(x.deans.length?esc(names(x)):esc(x.src==='gap'?'-':(x.note||'No duty')))+'</td>';
    }).join('')+'</tr>';
  }
  $('nx').innerHTML=t+'</table>';
  /* Remember the real block heights so the title stays put on the next load while data is arriving. */
  try{var c=$('cards'),n=$('nx');c.style.minHeight=n.style.minHeight='0';var hh=[c.offsetHeight,n.offsetHeight];if(hh[0]>0&&hh[1]>0)localStorage.setItem('wod_h',hh.join())}catch(e){}
}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('en-US',{timeZone:'America/Phoenix',hour:'numeric',minute:'2-digit'})}catch(e){return''}}

/* ---------- data ---------- */
function getJSON(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function gasOn(){return !!(CFG&&CFG.gasUrl&&/^https?:\/\//.test(CFG.gasUrl))}
function loadLive(){
  if(!gasOn())return Promise.resolve();
  return fetch(CFG.gasUrl,{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error(r.status);
    return r.json().then(function(j){if(!j||!j.ok)throw new Error('bad');LIVE=j.items||[]});
  }).then(function(){liveOK=true;lastLive=Date.now();try{localStorage.setItem('wod_live',JSON.stringify(LIVE))}catch(e){}})
  .catch(function(){liveOK=false;try{LIVE=JSON.parse(localStorage.getItem('wod_live')||'[]')}catch(e){LIVE=[]}});
}
function loadAll(){
  var cached=null;try{cached=localStorage.getItem('wod_live')}catch(e){}
  return Promise.all([getJSON('data/schedule.json'),getJSON('data/overrides.json').catch(function(){return{items:[]}}),getJSON('data/config.json').catch(function(){return null})]).then(function(a){
    S=a[0];FILE=a[1].items||[];CFG=a[2];
    var p=loadLive().then(function(){if(booted)render()});
    /* Show right away from the last saved live data; the fresh copy swaps in quietly when it arrives. */
    if(cached){try{LIVE=JSON.parse(cached)||[]}catch(e){LIVE=[]}return}
    return Promise.race([p,new Promise(function(r){setTimeout(r,1200)})]);
  }).then(render).catch(function(e){$('cards').textContent='Could not load the schedule. Please try again.'}).then(boot);
}
/* Start the staggered fade-in as soon as data is rendered. Photos fade in on their own load. */
var booted=false;
function boot(){
  if(booted)return;booted=true;
  var hr=$("hr");
  if(hr)hr.style.setProperty('--tx',Math.max(0,hr.offsetWidth-22)+'px');
  requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.add('go')})});
}
setTimeout(function(){document.body.classList.add('go')},6000); /* safety: never leave the page hidden */

/* ---------- passcode: sent with each save and checked on the server ---------- */
function checkCode(code){
  if(!/^[0-9]{4}$/.test(code))return Promise.reject(new Error('Please enter the four digit code.'));
  return Promise.resolve(code);
}

/* ---------- sheet ---------- */
var mode='on';
function show(m,t){var e=$('msg');e.className='msg on '+m;e.textContent=t}
function hideMsg(){$('msg').className='msg'}
function setMode(m){
  mode=m;$('m1').className=m==='on'?'on':'';$('m2').className=m==='corr'?'on':'';
  $('corrOnly').style.display=m==='corr'?'block':'none';
  $('save').textContent=m==='on'?"I'm on duty today":'Save correction';
  hideMsg();syncReset();
}
/* Dorm is never asked for: it comes from the dean's own dorm in config (S.deans[id].dorm). */
function dormOf(id){return S.deans[id].dorm}
function syncDeans(){
  var d=$('date').value;
  Object.keys(S.dorms).forEach(function(dorm){
    var cur=resolve(dorm,d).deans;
    [].forEach.call(document.querySelectorAll('#deanChecks input[data-dorm="'+dorm+'"]'),function(c){c.checked=cur.indexOf(c.value)>=0});
  });
}
function syncReset(){
  var d=$('date').value;
  $('reset').style.display=(mode==='corr'&&Object.keys(S.dorms).some(function(dorm){return resolve(dorm,d).src==='override'}))?'inline-block':'none';
}
function openSheet(){
  var today=dutyDate();
  var me=null;try{me=localStorage.getItem('wod_me')}catch(e){}
  $('me').innerHTML=Object.keys(S.deans).map(function(k){return '<option value="'+k+'">'+esc(S.deans[k].name)+'</option>'}).join('');
  if(me&&S.deans[me])$('me').value=me;
  var o='';for(var i=0;i<6;i++){var d=addDays(today,i);o+='<option value="'+d+'">'+esc(i===0?'Today - '+fmt(d,{weekday:'short',month:'short',day:'numeric'}):fmt(d,{weekday:'long',month:'short',day:'numeric'}))+'</option>'}
  $('date').innerHTML=o;
  $('deanChecks').innerHTML=Object.keys(S.dorms).map(function(dorm){
    return '<div class="grp">'+esc(S.dorms[dorm].label)+'</div>'+Object.keys(S.deans).filter(function(k){return S.deans[k].dorm===dorm}).map(function(k){return '<label class="chk"><input type="radio" name="pick-'+dorm+'" data-dorm="'+dorm+'" value="'+k+'"> '+esc(S.deans[k].name)+'</label>'}).join('');
  }).join('');
  syncDeans();
  showStep('form');setMode('on');
  $('ov').className='ov-wrap on';
}
function closeSheet(){$('ov').className='ov-wrap'}

function same(a,b){return a.slice().sort().join()===b.slice().sort().join()}
var pending=null;
function showStep(w){
  $('formStep').style.display=w==='form'?'block':'none';
  $('codeStep').style.display=w==='code'?'block':'none';
  hideMsg();
  if(w==='code'){$('code').value='';setTimeout(function(){try{$('code').focus()}catch(e){}},50)}
}
function save(clear){
  hideMsg();
  var me=$('me').value,date,entries=[],at=new Date(nowMs()).toISOString();
  if(mode==='on'){
    date=dutyDate();
    entries.push({date:date,dorm:dormOf(me),deans:[me],kind:'on-duty',by:me,at:at,note:''});
  }else{
    date=$('date').value;
    Object.keys(S.dorms).forEach(function(dorm){
      if(clear){if(resolve(dorm,date).src==='override')entries.push({date:date,dorm:dorm,clear:true,by:me,at:at});return}
      var picked=[].filter.call(document.querySelectorAll('#deanChecks input[data-dorm="'+dorm+'"]'),function(c){return c.checked}).map(function(c){return c.value});
      if(!same(picked,resolve(dorm,date).deans))entries.push({date:date,dorm:dorm,deans:picked,kind:'correction',by:me,at:at,note:''});
    });
    if(!entries.length){show('info','No changes to save.');return}
  }
  if(!gasOn()){show('err','Live changes are not turned on for this site yet.');return}
  pending={entries:entries,me:me};
  showStep('code');
}
function commit(){
  if(!pending)return;
  var entries=pending.entries,me=pending.me;
  hideMsg();$('codeOk').disabled=true;$('codeBack').disabled=true;
  checkCode($('code').value.trim()).then(function(pin){
    return fetch(CFG.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:pin,action:'save',entries:entries})}).then(function(r){
      if(!r.ok)throw new Error('Server said '+r.status);
      return r.json();
    }).then(function(j){
      if(j&&j.ok){LIVE=j.items||[];return}
      if(j&&j.error==='bad_pin')throw new Error("That code isn't right. Please try again.");
      if(j&&j.error==='locked')throw new Error('Too many wrong codes. Please wait a few minutes.');
      throw new Error('The server did not accept the change. Ask Logan.');
    });
  }).then(function(){
    try{localStorage.setItem('wod_me',me);localStorage.setItem('wod_live',JSON.stringify(LIVE))}catch(e){}
    pending=null;liveOK=true;render();closeSheet();
  }).catch(function(e){
    show('err',e.message||'Could not save. Check your connection and try again.');
    $('code').value='';
  }).then(function(){$('codeOk').disabled=false;$('codeBack').disabled=false});
}

$('open').onclick=openSheet;$('cancel').onclick=closeSheet;
$('ov').addEventListener('click',function(e){if(e.target===$('ov'))closeSheet()});
$('m1').onclick=function(){setMode('on')};$('m2').onclick=function(){setMode('corr');syncDeans();syncReset()};
$('date').onchange=function(){syncDeans();syncReset();hideMsg()};
$('save').onclick=function(){save(false)};
$('reset').onclick=function(){save(true)};
$('codeBack').onclick=function(){pending=null;showStep('form')};
$('codeOk').onclick=commit;
$('code').oninput=function(){this.value=this.value.replace(/[^0-9]/g,'').slice(0,4);if(this.value.length===4)commit()};
$('code').onkeydown=function(e){if(e.key==='Enter')commit()};
try{localStorage.removeItem('wod_wk')}catch(e){}

loadAll();
setInterval(render,60000);
setInterval(function(){if(S)loadLive().then(render)},180000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S&&Date.now()-lastLive>30000)loadLive().then(render)});
})();
</script>
<script>
/* ---- first-visit "Add to Home Screen" tip + little plus button (ported from the Card Tracker site) ---- */
(function(){
  var $=function(i){return document.getElementById(i)};
  var KEY="whosOnDutyA2HS";
  var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  var standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var mobile=ios||/android|mobi/i.test(navigator.userAgent)||(window.matchMedia("(pointer:coarse)").matches&&navigator.maxTouchPoints>0);
  var mac=/mac/i.test(navigator.platform||"")||/Macintosh/.test(navigator.userAgent);
  var ICON_ADD='<svg viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="3" width="16" height="16" rx="4.6"/><path d="M11 7.4v7.2M7.4 11h7.2"/></svg>';
  var ICON_BOOK='<svg viewBox="0 0 22 22" aria-hidden="true"><path d="M11 6.2C9.3 4.9 6.6 4.4 3.2 4.6v12.2c3.4-.2 6.1.3 7.8 1.6 1.7-1.3 4.4-1.8 7.8-1.6V4.6c-3.4-.2-6.1.3-7.8 1.6zM11 6.2v12.2"/></svg>';
  if(!ios)$("a2hsSteps").style.display="none";
  if(!ios)$("a2hsText").innerHTML="Open your browser menu and choose <b>Add to Home screen</b> or <b>Install app</b>.";
  if(mobile){$("help").innerHTML=ICON_ADD}
  else{
    $("help").innerHTML=ICON_BOOK;$("help").setAttribute("aria-label","Bookmark this page");
    $("a2hs").setAttribute("aria-label","Bookmark this page");
    $("a2hs").querySelector(".a2hsHead b").textContent="Bookmark Who's on duty?";
    $("a2hsText").innerHTML="Press <b>"+(mac?"\u2318D":"Ctrl+D")+"</b> to bookmark this page.<br>In Safari, choose <b>Favorites</b> to keep it in your favorites bar.";
  }
  var close=function(v){ls.set(KEY,v);$("a2hs").style.display="none"};
  $("a2hsX").onclick=function(){close("dismissed")};
  var show=function(){$("a2hs").style.display="block"};
  if(standalone){$("help").style.display="none";return}
  $("help").onclick=show;
  if(!mobile||ls.get(KEY))return;
  setTimeout(show,800);
})();
</script>
<script>
function fitPills(){[].forEach.call(document.querySelectorAll('.pill'),function(p){var t=p.querySelector('.pt');if(!t)return;var cs=getComputedStyle(p),inner=p.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ov=t.scrollWidth-inner;if(ov>1){p.style.setProperty('--mx',(-ov)+'px');p.style.setProperty('--mt',Math.max(3,ov/12+2)+'s');p.classList.add('mq')}else{p.classList.remove('mq')}})}
addEventListener('resize',fitPills);addEventListener('load',fitPills);new MutationObserver(function(){requestAnimationFrame(fitPills)}).observe(document.body,{childList:true,subtree:true});
</script>
